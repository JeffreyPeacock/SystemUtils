[pytest]
testpaths = tests

# A scan that fails to terminate is the failure mode this suite most needs to
# catch: scan_dir shuts its workers down with one empty-string sentinel per
# worker, and getting that wrong HANGS rather than raises. A hung build never
# goes red -- it is killed by a CI job limit with no output naming the cause.
#
# pytest-timeout, method "thread", is what turns that into a red build: it
# dumps a traceback for every thread -- naming the consumers blocked in
# queue.get() -- and then kills the process with a non-zero status.
#
# pytest's built-in `faulthandler_timeout` is NOT a substitute and was tried
# first. It dumps the same tracebacks but does not stop anything: a 30s test
# under `faulthandler_timeout = 5` still ran its full 30 seconds and still
# PASSED. Diagnostics, not a gate.
#
# Nor is a fixture that runs the scan on a side thread and fails fast. That
# makes matters worse: the test goes red at its own timeout, then the run wedges
# at interpreter exit instead, because ThreadPoolExecutor's threads are not
# daemons and are joined at shutdown. Killing the process is the only thing that
# works, and only a plugin can do it from inside a test.
#
# 60s against a suite that finishes in about 4s -- large enough that a slow
# machine never trips it, small enough to fail inside any CI job limit.
timeout = 60
timeout_method = thread
addopts =
    --cov=src
    --cov-branch
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --junitxml=test-results.xml
    --cov-fail-under=95
