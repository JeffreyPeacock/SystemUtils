[mypy]
ignore_missing_imports = true
check_untyped_defs = true

# src/ is largely untyped. A module graduates by passing `check_untyped_defs`
# and then being removed from this list — never by loosening the defaults.
#
# `gui` and `main` graduated in #36 (`gui` has since left the project with the
# GUI, #51). Neither needed annotating; they simply passed, which means the
# stanza had been guarding nothing.
#
# `db` graduated in #60, and that one did need work: a TypedDict for
# `audit_db`'s return plus annotations on `duplicates` and `md5_to_paths`. Its
# stanza had started hiding a NEW error -- #57 added a key the inferred
# dict[str, int] rejected and nothing reported it -- which is the argument for
# re-running mypy with these stanzas stripped rather than trusting their
# silence.
#
# The two left each fail on exactly one container literal mypy cannot infer:
#
#   file_ops    `file_queue`
#   reporting   `file_queue`
#
# Those are annotations, not redesigns. Whoever adds them should delete the
# stanza in the same commit.
[mypy-src.file_ops]
check_untyped_defs = false

[mypy-src.reporting]
check_untyped_defs = false
