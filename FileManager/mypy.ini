[mypy]
ignore_missing_imports = true
check_untyped_defs = true

# src/ is currently untyped. Each module graduates to strict checking by being
# annotated and then removed from this list — never by loosening the defaults.
[mypy-src.db]
check_untyped_defs = false

[mypy-src.file_ops]
check_untyped_defs = false

[mypy-src.gui]
check_untyped_defs = false

[mypy-src.main]
check_untyped_defs = false

[mypy-src.reporting]
check_untyped_defs = false
