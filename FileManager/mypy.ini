[mypy]
ignore_missing_imports = true
check_untyped_defs = true

# src/ is largely untyped. A module graduates by passing `check_untyped_defs`
# and then being removed from this list — never by loosening the defaults.
#
# `gui` and `main` graduated in #36. Neither needed annotating; they simply
# passed, which means the stanza had been guarding nothing. The three left each
# fail on exactly one thing, a container literal mypy cannot infer:
#
#   db          `duplicates` and `md5_to_paths`
#   file_ops    `file_queue`
#   reporting   `file_queue`
#
# Those are annotations, not redesigns. Whoever adds them should delete the
# stanza in the same commit.
[mypy-src.db]
check_untyped_defs = false

[mypy-src.file_ops]
check_untyped_defs = false

[mypy-src.reporting]
check_untyped_defs = false
